{% extends 'base.html' %} {% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">Home</h4>
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h4 class="card-title">List of Colleges</h4>
                                <div class="card-category">Page Subtitle</div>
                            </div>
                            <a href="{% url 'college-add' %}" class="btn btn-success btn-rounded">Add College</a>
                        </div>
                    </div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th scope="col">College Name</th>
                                    <th scope="col" class="text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for college in colleges %}
                                <tr>
                                    <td>{{ college.college_name }}</td>
                                    <td class="text-center">
                                        <a href="{% url 'college-update' college.pk %}" class="text-primary mr-2">Edit</a>
                                        <a href="{% url 'college-delete' college.pk %}" class="text-danger">Delete</a>
                                    </td>
                                </tr>
                                {% empty %}
                                <tr>
                                    <td colspan="2" class="text-center text-muted">No college records found.</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
